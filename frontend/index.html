<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgroSim - Agricultura de Precisão IoT</title>

    <!-- MQTT.js global (não ESM) -->
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            background: #000;
        }

        #canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        .panel {
            position: absolute;
            background: rgba(0, 0, 0, 0.85);
            color: white;
            padding: 15px;
            border-radius: 8px;
            max-width: 300px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        #climate-panel {
            top: 10px;
            left: 10px;
        }

        #sensor-panel {
            top: 10px;
            right: 10px;
            max-height: 90vh;
            overflow-y: auto;
        }

        #mqtt-panel {
            bottom: 10px;
            left: 10px;
            width: 400px;
            max-height: 300px;
        }

        h3 {
            margin-bottom: 10px;
            color: #4caf50;
            font-size: 16px;
        }

        h4 {
            margin: 10px 0 5px;
            color: #81c784;
            font-size: 14px;
        }

        .control-group {
            margin-bottom: 10px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-size: 12px;
            color: #aaa;
        }

        select,
        button {
            width: 100%;
            padding: 8px;
            border: none;
            border-radius: 4px;
            background: #4caf50;
            color: white;
            cursor: pointer;
            margin-bottom: 5px;
            font-size: 12px;
        }

        button:hover {
            background: #45a049;
        }

        button:active {
            transform: scale(0.98);
        }

        .sensor-buttons button {
            font-size: 11px;
            padding: 6px;
        }

        .climate-display {
            background: rgba(255, 255, 255, 0.05);
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 10px;
        }

        .metric {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
            border-bottom: 1px solid #333;
            font-size: 13px;
        }

        .value {
            color: #4caf50;
            font-weight: bold;
        }

        #sensor-list {
            margin-top: 10px;
        }

        #active-sensors {
            list-style: none;
            font-size: 11px;
            max-height: 200px;
            overflow-y: auto;
        }

        #active-sensors li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px;
            background: rgba(255, 255, 255, 0.1);
            margin-bottom: 5px;
            border-radius: 4px;
            flex-wrap: wrap;
            gap: 5px;
        }

        .status {
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 3px;
            font-weight: bold;
        }

        .status.active {
            background: #4caf50;
        }

        .status.inactive {
            background: #f44336;
        }

        #active-sensors button {
            width: auto;
            padding: 2px 8px;
            font-size: 10px;
            margin: 0;
        }

        #mqtt-log {
            height: 150px;
            overflow-y: auto;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px;
            font-family: 'Courier New', monospace;
            font-size: 11px;
            border-radius: 4px;
            border: 1px solid #333;
        }

        .log-entry {
            margin-bottom: 3px;
            padding: 3px;
            border-left: 2px solid #4caf50;
            padding-left: 8px;
            background: rgba(255, 255, 255, 0.03);
        }

        .time {
            color: #888;
            font-size: 10px;
        }

        .topic {
            color: #81c784;
        }

        .mqtt-stats {
            display: flex;
            justify-content: space-between;
            margin-top: 8px;
            font-size: 12px;
            color: #aaa;
        }

        #mqtt-status {
            font-weight: bold;
        }
    </style>
</head>

<body>
    <!-- Painel Climático -->
    <div class="panel" id="climate-panel">
        <h3>🌤️ Controle Climático</h3>
        <div class="control-group">
            <label>Estação:</label>
            <select id="season-select" onchange="app.setSeason(this.value)">
                <option value="spring">🌸 Primavera</option>
                <option value="summer">☀️ Verão</option>
                <option value="fall">🍂 Outono</option>
                <option value="winter">❄️ Inverno</option>
            </select>
        </div>
        <div class="climate-display">
            <div class="metric">
                <span>🌡️ Temperatura:</span>
                <span><span id="temp-value" class="value">--</span>°C</span>
            </div>
            <div class="metric">
                <span>💧 Umidade:</span>
                <span><span id="humidity-value" class="value">--</span>%</span>
            </div>
            <div class="metric">
                <span>🌧️ Chuva:</span>
                <span><span id="rain-value" class="value">--</span>mm/h</span>
            </div>
            <div class="metric">
                <span>💨 Vento:</span>
                <span><span id="wind-value" class="value">--</span>km/h</span>
            </div>
            <div class="metric">
                <span>☀️ Radiação:</span>
                <span><span id="solar-value" class="value">--</span>W/m²</span>
            </div>
        </div>
        <button onclick="app.forceRain()">🌧️ Forçar Chuva</button>
    </div>

    <!-- Painel de Sensores -->
    <div class="panel" id="sensor-panel">
        <h3>📡 Gerenciar Sensores</h3>
        <div class="sensor-buttons">
            <button onclick="app.addSensor('temperature')">🌡️ Temperatura</button>
            <button onclick="app.addSensor('humidity')">💧 Umidade Ar</button>
            <button onclick="app.addSensor('rain')">🌧️ Pluviômetro</button>
            <button onclick="app.addSensor('soil_moisture')">🌱 Umidade Solo</button>
            <button onclick="app.addSensor('wind')">💨 Vento</button>
            <button onclick="app.addSensor('solar')">☀️ Solar</button>
        </div>

        <div id="sensor-list">
            <h4>Sensores Ativos:</h4>
            <ul id="active-sensors">
                <li style="color: #888;">Nenhum sensor adicionado</li>
            </ul>
        </div>
    </div>

    <!-- Painel MQTT -->
    <div class="panel" id="mqtt-panel">
        <h3>📊 Dados MQTT</h3>
        <div id="mqtt-log">
            <div class="log-entry" style="color: #888;">Aguardando conexão...</div>
        </div>
        <div class="mqtt-stats">
            <span>Msgs/seg: <span id="msg-rate">0</span></span>
            <span id="mqtt-status">🔴 Offline</span>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <!-- MQTT.js -->
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

    <!-- Scripts da aplicação (sem módulos) -->
    <script src="js/mqtt-client.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
